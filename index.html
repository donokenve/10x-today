<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>10X Today</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@400;600;800&display=swap">
<style>
  :root { color-scheme:dark; --bg:#0a0713; --panel:#150f26; --panel-2:#1d1535; --line:#2a2142; --ink:#ffffff; --ink-2:#b9b0d6; --ink-3:#6b6390; --gold:#a78bfa; --gold-2:#7c3aed; --pink:#f472b6; --red:#fb5c6e; --green:#34d399; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Inter Tight",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(70vw 70vh at 10% 10%, rgba(124,58,237,.22), transparent 60%), radial-gradient(60vw 60vh at 95% 100%, rgba(244,114,182,.10), transparent 60%); }
  h1,h2,h3 { font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif; font-weight:400; margin:0; letter-spacing:.01em; text-wrap:balance; }
  button { font:inherit; color:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .wrap { position:relative; max-width:1280px; margin:0 auto; padding-inline:clamp(16px,4vw,48px); padding-block:calc(24px + env(safe-area-inset-top,0px)) 64px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px; }
  .brand { font-family:"Bebas Neue"; font-size:28px; letter-spacing:.12em; color:var(--gold); }
  .brand small { font-family:"Inter Tight"; font-size:11px; letter-spacing:.2em; color:var(--ink-3); margin-left:10px; vertical-align:middle; }
  .status { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); }
  .status.warn { color:var(--pink); }
  .k { font-size:13px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .k::before { content:""; width:32px; height:2px; background:var(--gold); }
  .empty { border:1px dashed var(--line); border-radius:18px; padding:40px; color:var(--ink-3); text-align:center; }

  .head { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .head img { width:84px; height:84px; border-radius:50%; object-fit:cover; object-position:50% 20%; border:3px solid var(--gold); box-shadow:0 0 0 8px rgba(167,139,250,.12); }
  .head h1 { font-size:clamp(56px,8vw,110px); line-height:.85; }
  .head .sb { color:var(--ink-2); font-size:16px; margin-top:6px; }
  .head .sb b { color:var(--gold); font-weight:600; }
  .prog { margin-left:auto; text-align:right; }
  .prog .v { font-family:"Bebas Neue"; font-size:56px; line-height:1; color:var(--gold); font-variant-numeric:tabular-nums; }
  .prog .l { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); }
  .bar { height:4px; background:var(--line); border-radius:4px; margin-top:20px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold-2),var(--pink)); transition:width .5s ease; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:28px; margin-top:32px; align-items:start; }
  .boards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .board { position:relative; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:18px; padding:26px 24px 22px; min-height:220px; display:flex; flex-direction:column; gap:10px; transition:transform .2s, border-color .2s, box-shadow .2s; }
  .board:hover { transform:translateY(-3px); border-color:var(--gold); box-shadow:0 20px 60px rgba(124,58,237,.25); }
  .board .n { font-family:"Bebas Neue"; font-size:64px; line-height:.8; background:linear-gradient(135deg,#c084fc,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .board .t { font-family:"Bebas Neue"; font-size:clamp(32px,3vw,42px); line-height:.95; }
  .board .o { color:var(--ink-2); font-size:15px; line-height:1.35; }
  .board .go { margin-top:auto; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .board.done { opacity:.55; border-color:rgba(52,211,153,.4); }
  .board.done .n { background:none; color:var(--green); -webkit-text-fill-color:var(--green); }
  .board.done .go { color:var(--green); }
  .due { position:absolute; top:18px; right:18px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:600; font-variant-numeric:tabular-nums; }
  .due.soon { color:var(--red); }
  .ov .due { position:static; display:inline-block; margin-top:14px; font-size:13px; }
  .li .due { position:static; margin-right:4px; }

  .side { border:1px solid var(--line); background:var(--panel); border-radius:18px; padding:22px; position:sticky; top:20px; }
  .side h3 { font-size:30px; }
  .hint { color:var(--ink-3); font-size:13px; margin-top:2px; }
  .refs { display:grid; gap:10px; margin-top:16px; }
  .ref { display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); text-decoration:none; color:var(--ink); transition:border-color .2s; }
  a.ref:hover { border-color:var(--gold); }
  .ref .av { flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,var(--gold-2),var(--pink)); font-weight:800; font-size:14px; }
  .ref .h { font-weight:600; font-size:15px; word-break:break-all; }
  .ref .nt { color:var(--ink-2); font-size:13px; }
  .ref .x { margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:18px; padding:4px 8px; }
  .ref .x:hover { color:var(--red); }

  .ov { position:fixed; z-index:20; background:var(--panel); border:1px solid var(--gold); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; transition:top .45s cubic-bezier(.2,.8,.2,1), left .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1), height .45s cubic-bezier(.2,.8,.2,1), border-radius .45s, opacity .3s; }
  .ov.full { border-radius:0; }
  .ov .in { flex:1; overflow-y:auto; padding:clamp(24px,6vh,72px) clamp(20px,8vw,120px); opacity:0; transform:translateY(16px); transition:opacity .35s ease .2s, transform .35s ease .2s; }
  .ov.full .in { opacity:1; transform:none; }
  .ov .close { position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:2; width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--panel-2); font-size:22px; }
  .ov .n { font-family:"Bebas Neue"; font-size:clamp(80px,12vw,160px); line-height:.8; background:linear-gradient(135deg,#c084fc,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .ov h2 { font-size:clamp(48px,7vw,104px); line-height:.9; margin-top:8px; max-width:18ch; }
  .ov .o { color:var(--ink-2); font-size:clamp(18px,2vw,26px); margin-top:14px; max-width:40ch; line-height:1.35; }
  .steps { display:grid; gap:12px; margin-top:36px; max-width:760px; }
  .step { display:flex; gap:16px; align-items:flex-start; text-align:left; width:100%; padding:18px 20px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); font-size:clamp(16px,1.6vw,21px); line-height:1.35; transition:border-color .2s, opacity .2s; }
  .step:hover { border-color:var(--gold); }
  .step .c { flex:none; width:32px; height:32px; border-radius:50%; border:2px solid var(--ink-3); display:grid; place-items:center; font-family:"Bebas Neue"; font-size:20px; color:var(--ink-3); }
  .step.on { opacity:.6; } .step.on .c { border-color:var(--green); background:var(--green); color:var(--bg); }
  .step.on .tx { text-decoration:line-through; text-decoration-color:var(--ink-3); }
  .acts { display:flex; gap:12px; flex-wrap:wrap; margin-top:36px; }
  .btn { border:0; border-radius:12px; padding:16px 28px; font-family:"Bebas Neue"; font-size:26px; letter-spacing:.06em; background:linear-gradient(135deg,var(--gold-2),var(--gold)); color:#fff; box-shadow:0 10px 40px rgba(124,58,237,.45); transition:transform .15s; }
  .btn:hover { transform:translateY(-2px); }
  .btn.ghost { background:var(--panel-2); border:1px solid var(--line); box-shadow:none; color:var(--ink-2); }
  .btn.ok { background:linear-gradient(135deg,#059669,var(--green)); box-shadow:0 10px 40px rgba(52,211,153,.3); }
  .btn.sm { font-size:18px; padding:10px 18px; border-radius:10px; }

  .adm-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; margin-top:24px; }
  .card { border:1px solid var(--line); background:var(--panel); border-radius:18px; padding:22px; }
  .card h3 { font-size:30px; margin-bottom:14px; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg button { border:1px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px 18px; font-weight:600; }
  .seg button[aria-pressed="true"] { border-color:var(--gold); background:rgba(167,139,250,.18); color:#fff; }
  label { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin:16px 0 6px; }
  input, textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:12px 14px; font:inherit; font-size:15px; }
  textarea { min-height:120px; resize:vertical; line-height:1.4; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center; }
  .lst { display:grid; gap:8px; }
  .li { display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line); }
  .li .t { font-weight:600; } .li .o { color:var(--ink-3); font-size:13px; }
  .li .grow { flex:1; min-width:0; }
  .ic { border:1px solid var(--line); background:var(--bg); border-radius:8px; width:34px; height:34px; font-size:15px; color:var(--ink-2); flex:none; }
  .ic:hover { border-color:var(--gold); color:#fff; }
  .ic.del:hover { border-color:var(--red); color:var(--red); }
  .links { display:grid; gap:8px; }
  .lnk { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); flex-wrap:wrap; }
  .lnk b { width:70px; flex:none; } .lnk code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2); font-size:13px; user-select:all; }
  .who-h { font-family:"Bebas Neue"; font-size:24px; color:var(--gold); margin:14px 0 8px; }
  .savebar { position:sticky; top:12px; z-index:10; display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; border:1px solid var(--gold); background:rgba(21,15,38,.95); backdrop-filter:blur(6px); margin-top:20px; }
  .savebar span { flex:1; color:var(--ink-2); font-size:14px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--panel-2); border:1px solid var(--gold); border-radius:12px; padding:12px 18px; font-size:14px; transition:all .25s; z-index:40; pointer-events:none; }
  .toast.on { opacity:1; transform:translateX(-50%); }

  @media (max-width:900px) { .layout, .adm-grid { grid-template-columns:1fr; } .side { position:static; } .prog { margin-left:0; text-align:left; } }
  @media (prefers-reduced-motion: reduce) { .ov, .ov .in, .board, .bar i { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">10X<small>TODAY</small></span><div class="status" id="status"></div></div>
  <main id="app"><div class="empty" style="margin-top:12vh">Loading…</div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var REPO = "donokenve/10x-today", PAGE = "https://donokenve.github.io/10x-today/", FILE = "data.json";
  var app = document.getElementById('app'), statusEl = document.getElementById('status');
  var role = null, key = null, data = null, ver = null, openId = null, ov = null;
  var form = { who:"both", editId:null }, refWho = "rysa", dirty = false, saving = false;

  /* ---------- crypto (AES-256-GCM, key lives only in the link after #) ---------- */
  function b64u(buf){ var s='', b=new Uint8Array(buf); for (var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length%4) s+='='; var r=atob(s), o=new Uint8Array(r.length); for (var i=0;i<r.length;i++) o[i]=r.charCodeAt(i); return o; }
  function importKey(raw){ return crypto.subtle.importKey('raw', unb64u(raw), 'AES-GCM', false, ['encrypt','decrypt']); }
  async function enc(rawKey, obj){ var k=await importKey(rawKey), iv=crypto.getRandomValues(new Uint8Array(12)); var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, k, new TextEncoder().encode(JSON.stringify(obj))); return { iv:b64u(iv), ct:b64u(ct) }; }
  async function dec(rawKey, blob){ var k=await importKey(rawKey); var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(blob.iv)}, k, unb64u(blob.ct)); return JSON.parse(new TextDecoder().decode(pt)); }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2600); }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { if (v) localStorage.setItem(k,v); else localStorage.removeItem(k); } catch(e){} }
  function setStatus(t, warn){ statusEl.textContent=t; statusEl.classList.toggle('warn', !!warn); }
  function people(){ return data.people || {}; }
  function mine(who){ return (data.tasks||[]).filter(function(t){ return t.who===who; }).sort(function(a,b){ return a.order-b.order; }); }
  function isDone(t){ return lsGet('done:'+t.id)==='1'; }
  function fmtTime(hm){ var m=/^(\d{1,2}):(\d{2})$/.exec(hm||''); if(!m) return ''; var h=+m[1], ap=h>=12?'pm':'am'; return (h%12||12)+(m[2]==='00'?'':':'+m[2])+ap; }
  function minsLeft(hm){ var m=/^(\d{1,2}):(\d{2})$/.exec(hm||''); if(!m) return null; var d=new Date(); return (new Date(d.getFullYear(),d.getMonth(),d.getDate(),+m[1],+m[2])-d)/60000; }
  function dueHtml(t, staff){ if(!t.due || (staff && isDone(t))) return ''; var l=minsLeft(t.due); return '<span class="due'+(l!=null&&l<=30?' soon':'')+'">'+(l!=null&&l<0?'Overdue · ':'Due ')+fmtTime(t.due)+'</span>'; }
  function uid(){ return b64u(crypto.getRandomValues(new Uint8Array(6))); }

  /* ---------- load ---------- */
  function parseHash(){ var m=/^#(rysa|rachel|admin)\.([A-Za-z0-9_-]{40,})$/.exec(location.hash||''); return m ? { role:m[1], key:m[2] } : null; }
  async function fetchFile(){ var r = await fetch(FILE+'?t='+Date.now(), { cache:'no-store' }); if (!r.ok) throw new Error('fetch'); return r.json(); }
  async function load(first){
    var h = parseHash();
    if (!h) { app.innerHTML = '<div class="empty" style="margin-top:12vh">Open the link you were sent.</div>'; return; }
    role = h.role; key = h.key;
    try {
      var file = await fetchFile();
      if (!first && file.updated === ver) return;
      if (role === 'admin' && dirty) { setStatus('Unsaved changes', true); return; }
      var blob = file.blobs && file.blobs[role]; if (!blob) throw new Error('blob');
      data = await dec(key, blob); ver = file.updated; setStatus('Live');
      if (role === 'admin' && !data.keys) throw new Error('keys');
    } catch (e) {
      if (first) app.innerHTML = '<div class="empty" style="margin-top:12vh">Open the link you were sent.</div>';
      else setStatus('Offline', true);
      return;
    }
    if (ov) fillOverlay(); else render();
  }

  /* ---------- staff ---------- */
  function render(){ if (!data) return; if (role === 'admin') renderAdmin(); else renderStaff(); }

  function renderStaff(){
    var p = data.person, list = mine(role), done = list.filter(isDone).length, pct = list.length ? Math.round(done/list.length*100) : 0;
    var boards = list.length ? list.map(function(t,i){ var d=isDone(t);
      return '<button class="board'+(d?' done':'')+'" data-open="'+esc(t.id)+'">'+dueHtml(t,true)+'<span class="n">'+(d?'✓':(i+1))+'</span><span class="t">'+esc(t.title)+'</span><span class="o">'+esc(t.line)+'</span><span class="go">'+(d?'Done':'Open →')+'</span></button>';
    }).join('') : '<div class="empty">No tasks yet. Check back soon.</div>';
    var rl = (data.refs||[]).filter(function(x){ return x.who===role; });
    app.innerHTML =
      '<div class="head">'+(p.img?'<img src="'+p.img+'" alt="">':'')+'<div><div class="k">Today</div><h1>'+esc(p.name)+'</h1><div class="sb">Your creator: <b>'+esc(p.creator)+' · '+esc(p.niche)+'</b></div></div>' +
      '<div class="prog"><div class="v">'+done+' / '+list.length+'</div><div class="l">done today</div></div></div>' +
      '<div class="bar"><i style="width:'+pct+'%"></i></div>' +
      '<div class="layout"><div class="boards">'+boards+'</div>' +
      '<aside class="side"><h3>Reference accounts</h3><div class="hint">Accounts doing well right now for '+esc(p.creator)+'.</div><div class="refs">' +
      (rl.length ? rl.map(function(x){ return refHtml(x,false); }).join('') : '<div class="hint">None added yet.</div>') + '</div></aside></div>';
  }
  function refHtml(x, admin){
    var h=esc(x.handle||x.url||'Account'), ini=esc((x.handle||'?').replace(/^@/,'').charAt(0).toUpperCase());
    var inner='<span class="av">'+ini+'</span><span><div class="h">'+h+'</div>'+(x.note?'<div class="nt">'+esc(x.note)+'</div>':'')+'</span>';
    if (admin) return '<div class="ref">'+inner+'<button class="x" data-delref="'+esc(x.id)+'" aria-label="Remove">✕</button></div>';
    var url=/^https?:\/\//.test(x.url||'')?x.url:'';
    return url ? '<a class="ref" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>' : '<div class="ref">'+inner+'</div>';
  }

  function openTask(id, el){
    openId = id; var r = el.getBoundingClientRect();
    ov = document.createElement('div'); ov.className='ov';
    ov.style.top=r.top+'px'; ov.style.left=r.left+'px'; ov.style.width=r.width+'px'; ov.style.height=r.height+'px';
    ov.innerHTML='<button class="close" aria-label="Close">✕</button><div class="in"></div>';
    document.body.appendChild(ov); document.body.style.overflow='hidden'; fillOverlay();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ ov.classList.add('full'); ov.style.top='0px'; ov.style.left='0px'; ov.style.width='100vw'; ov.style.height='100vh'; ov.querySelector('.close').focus(); }); });
  }
  function closeTask(){
    if (!ov) return; var o=ov, id=openId; ov=null; openId=null; render();
    var el = app.querySelector('[data-open="'+id+'"]');
    if (el) { var r=el.getBoundingClientRect(); o.classList.remove('full'); o.style.top=r.top+'px'; o.style.left=r.left+'px'; o.style.width=r.width+'px'; o.style.height=r.height+'px'; }
    o.style.opacity='0'; setTimeout(function(){ o.remove(); document.body.style.overflow=''; if (el) el.focus(); }, 520);
  }
  function fillOverlay(){
    if (!ov) return; var t=(data.tasks||[]).filter(function(x){ return x.id===openId; })[0], inn=ov.querySelector('.in');
    if (!t) { inn.innerHTML='<h2>This task was removed.</h2>'; return; }
    var idx=mine(t.who).indexOf(t)+1, d=isDone(t);
    inn.innerHTML='<div class="k">Task '+idx+'</div><div class="n">'+(d?'✓':idx)+'</div><h2>'+esc(t.title)+'</h2><p class="o">'+esc(t.line)+'</p>'+dueHtml(t,true) +
      '<div class="steps">'+(t.steps||[]).map(function(s,i){ var on=lsGet('step:'+t.id+':'+i)==='1'; return '<button class="step'+(on?' on':'')+'" data-step="'+i+'"><span class="c">'+(on?'✓':(i+1))+'</span><span class="tx">'+esc(s)+'</span></button>'; }).join('')+'</div>' +
      '<div class="acts"><button class="btn '+(d?'ghost':'ok')+'" id="t-done">'+(d?'Mark not done':'Mark done')+'</button><button class="btn ghost" id="t-back">Back to my boards</button></div>';
  }

  /* ---------- admin ---------- */
  function renderAdmin(){
    var P = people(), editing = form.editId ? data.tasks.filter(function(t){ return t.id===form.editId; })[0] : null;
    var tok = lsGet('gh-token');
    var lists = ['rysa','rachel'].map(function(k){ var l=mine(k);
      return '<div class="who-h">'+esc(P[k].name)+' · '+esc(P[k].creator)+'</div><div class="lst">'+(l.length?l.map(function(t){
        return '<div class="li"><div class="grow"><div class="t">'+esc(t.title)+'</div><div class="o">'+esc(t.line)+'</div></div>'+dueHtml(t,false)+
          '<button class="ic" data-up="'+esc(t.id)+'" aria-label="Move up">↑</button><button class="ic" data-edit="'+esc(t.id)+'" aria-label="Edit">✎</button><button class="ic del" data-del="'+esc(t.id)+'" aria-label="Delete">✕</button></div>';
      }).join(''):'<div class="o" style="color:var(--ink-3)">No tasks.</div>')+'</div>';
    }).join('');
    var links = ['rysa','rachel','admin'].map(function(k){ var u=PAGE+'#'+k+'.'+(k==='admin'?key:data.keys[k]); return '<div class="lnk"><b>'+(P[k]?esc(P[k].name):'Admin')+'</b><code>'+esc(u)+'</code>'+(P[k]?'<a class="btn sm" href="'+esc(u)+'" target="_blank" rel="noopener">Open</a>':'')+'<button class="btn sm ghost" data-copy="'+esc(u)+'">Copy</button></div>'; }).join('');
    app.innerHTML = '<div class="k">Admin</div><h1 style="font-size:clamp(56px,8vw,110px);line-height:.85">Set the day.</h1>' +
      (dirty ? '<div class="savebar"><span>Changes not live yet.</span><button class="btn sm" id="save"'+(saving?' disabled':'')+'>'+(saving?'Publishing…':'Publish')+'</button></div>' : '') +
      '<div class="adm-grid">' +
      '<div class="card"><h3>'+(editing?'Edit task':'New task')+'</h3>' +
        (editing?'':'<label>For</label><div class="seg">'+['rysa','rachel','both'].map(function(w){ return '<button data-who="'+w+'" aria-pressed="'+(form.who===w)+'">'+(w==='both'?'Both':esc(P[w].name))+'</button>'; }).join('')+'</div>') +
        '<label for="f-title">Task</label><input id="f-title" maxlength="80" value="'+esc(editing?editing.title:'')+'">' +
        '<label for="f-line">One line under it</label><input id="f-line" maxlength="140" value="'+esc(editing?editing.line:'')+'">' +
        '<label for="f-steps">Steps · one per line</label><textarea id="f-steps">'+esc(editing?(editing.steps||[]).join('\n'):'')+'</textarea>' +
        '<label for="f-due">Deadline · optional</label><input id="f-due" type="time" style="max-width:180px" value="'+esc(editing&&editing.due?editing.due:'')+'">' +
        '<div class="row"><button class="btn" id="f-save">'+(editing?'Save':'Add task')+'</button>'+(editing?'<button class="btn ghost" id="f-cancel">Cancel</button>':'')+'</div></div>' +
      '<div class="card"><h3>Boards</h3>'+lists+'</div>' +
      '<div class="card"><h3>Reference accounts</h3><div class="seg">'+['rysa','rachel'].map(function(w){ return '<button data-refwho="'+w+'" aria-pressed="'+(refWho===w)+'">'+esc(P[w].name)+'</button>'; }).join('')+'</div>' +
        '<label for="r-handle">Handle</label><input id="r-handle" placeholder="@account">' +
        '<label for="r-url">Link</label><input id="r-url" placeholder="https://instagram.com/…">' +
        '<label for="r-note">Note</label><input id="r-note">' +
        '<div class="row"><button class="btn sm" id="r-add">Add account</button></div>' +
        '<div class="refs" style="margin-top:16px">'+((data.refs||[]).filter(function(x){ return x.who===refWho; }).map(function(x){ return refHtml(x,true); }).join('')||'<div class="hint">None yet.</div>')+'</div></div>' +
      '<div class="card"><h3>Links</h3><div class="hint" style="margin-bottom:12px">Each link holds its own key. Send each person only theirs. Never share the admin link.</div><div class="links">'+links+'</div>' +
        '<h3 style="margin-top:24px">GitHub key</h3><div class="hint">Needed to publish. Stored on this device only.</div>' +
        '<label for="gh">Token</label><input id="gh" type="password" autocomplete="off" placeholder="'+(tok?'Saved on this device':'github_pat_…')+'">' +
        '<div class="row"><button class="btn sm ghost" id="gh-save">Save key</button>'+(tok?'<button class="btn sm ghost" id="gh-clear">Remove</button>':'')+'</div></div>' +
      '</div>';
  }
  function mark(){ dirty = true; render(); }
  function saveTask(){
    var title=document.getElementById('f-title').value.trim(), line=document.getElementById('f-line').value.trim(), due=document.getElementById('f-due').value||'';
    var steps=document.getElementById('f-steps').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if (!title) { toast('Give the task a name.'); return; }
    if (form.editId) { var t=data.tasks.filter(function(x){ return x.id===form.editId; })[0]; if (t) { t.title=title; t.line=line; t.steps=steps; t.due=due; } form.editId=null; toast('Edited. Publish to send it.'); }
    else { var whos=form.who==='both'?['rysa','rachel']:[form.who], now=Date.now(); whos.forEach(function(w,i){ data.tasks.push({ id:uid(), who:w, title:title, line:line, steps:steps, due:due, order:now+i }); }); toast('Added. Publish to send it.'); }
    mark();
  }
  async function publish(){
    var tok = lsGet('gh-token'); if (!tok) { toast('Add your GitHub key first.'); return; }
    saving = true; render();
    try {
      var P = people(), upd = new Date().toISOString(), blobs = {};
      blobs.admin = await enc(key, data);
      for (var k of ['rysa','rachel']) blobs[k] = await enc(data.keys[k], { person:P[k], tasks:mine(k), refs:(data.refs||[]).filter(function(x){ return x.who===k; }) });
      var body = JSON.stringify({ v:1, updated:upd, blobs:blobs });
      var api = 'https://api.github.com/repos/'+REPO+'/contents/'+FILE, hd = { Authorization:'Bearer '+tok, Accept:'application/vnd.github+json' };
      var cur = await fetch(api+'?t='+Date.now(), { headers:hd, cache:'no-store' }); if (!cur.ok) throw new Error(cur.status===401||cur.status===403||cur.status===404?'key':'net');
      var sha = (await cur.json()).sha;
      var put = await fetch(api, { method:'PUT', headers:hd, body:JSON.stringify({ message:'Update tasks', content:btoa(unescape(encodeURIComponent(body))), sha:sha }) });
      if (!put.ok) throw new Error(put.status===409?'conflict':put.status===401||put.status===403?'key':'net');
      ver = upd; dirty = false; toast('Published. Live on their boards in about a minute.');
    } catch(e) {
      toast(e.message==='key' ? 'GitHub key was refused. Check it has write access to this repo.' : e.message==='conflict' ? 'Changed elsewhere. Reload and redo.' : 'Could not publish. Try again.');
    }
    saving = false; render();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.open) return openTask(t.dataset.open, t);
    if (t.classList.contains('close') || t.id==='t-back') return closeTask();
    if (t.dataset.step != null && openId) { var k='step:'+openId+':'+t.dataset.step; lsSet(k, lsGet(k)==='1'?'':'1'); return fillOverlay(); }
    if (t.id==='t-done') { var tk=data.tasks.filter(function(x){ return x.id===openId; })[0]; if (!tk) return; var nd=!isDone(tk); lsSet('done:'+tk.id, nd?'1':''); fillOverlay(); if (nd) { toast('Done. Next one.'); setTimeout(closeTask, 650); } return; }
    if (role !== 'admin') return;
    if (t.dataset.who) { form.who=t.dataset.who; return render(); }
    if (t.dataset.refwho) { refWho=t.dataset.refwho; return render(); }
    if (t.id==='f-save') return saveTask();
    if (t.id==='f-cancel') { form.editId=null; return render(); }
    if (t.dataset.edit) { form.editId=t.dataset.edit; render(); return window.scrollTo({top:0,behavior:'smooth'}); }
    if (t.dataset.up) { var tu=data.tasks.filter(function(x){ return x.id===t.dataset.up; })[0], l=mine(tu.who), i=l.indexOf(tu); if (i>0) { var a=l[i-1], o=a.order; a.order=tu.order; tu.order=o; if (a.order===tu.order) tu.order-=1; mark(); } return; }
    if (t.dataset.del) { if (!t.dataset.sure) { t.dataset.sure='1'; t.textContent='?'; toast('Tap ✕ again to delete'); return; } data.tasks=data.tasks.filter(function(x){ return x.id!==t.dataset.del; }); return mark(); }
    if (t.id==='r-add') { var h=document.getElementById('r-handle').value.trim(), u=document.getElementById('r-url').value.trim(), n=document.getElementById('r-note').value.trim(); if (!h&&!u) { toast('Add a handle or a link.'); return; } (data.refs=data.refs||[]).push({ id:uid(), who:refWho, handle:h, url:u, note:n }); toast('Added. Publish to send it.'); return mark(); }
    if (t.dataset.delref) { data.refs=data.refs.filter(function(x){ return x.id!==t.dataset.delref; }); return mark(); }
    if (t.id==='save') return publish();
    if (t.id==='gh-save') { var v=document.getElementById('gh').value.trim(); if (!v) { toast('Paste the key first.'); return; } lsSet('gh-token', v); toast('Key saved on this device.'); return render(); }
    if (t.id==='gh-clear') { lsSet('gh-token',''); toast('Key removed.'); return render(); }
    if (t.dataset.copy) { var c=t.dataset.copy; navigator.clipboard.writeText(c).then(function(){ toast('Copied'); }, function(){ var r=document.createRange(); r.selectNodeContents(t.parentNode.querySelector('code')); var s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Copy it.'); }); return; }
  });
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && ov) closeTask(); });
  window.addEventListener('beforeunload', function(e){ if (dirty) { e.preventDefault(); e.returnValue=''; } });
  window.addEventListener('hashchange', function(){ location.reload(); });

  load(true);
  setInterval(function(){ if (document.visibilityState === 'visible') load(false); }, 60000);
  setInterval(function(){ if (data && role !== 'admin') { if (ov) fillOverlay(); else render(); } }, 60000);
})();
</script>
</body>
</html>
